[project]
name = "repro-engine"
version = "0.4.0"
description = "Repro engine: reproduces agent-written code changes base-vs-head and verifies their claims against execution evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "griffelib>=2.3.2,<2.4",
    "grimp>=3.17,<3.18",  # the grimp worker uses its package-finder setting, not public API
    "packaging>=26.3",
    "pydantic>=2.14.1",
    "repro-events",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
repro = "repro.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "repro"
