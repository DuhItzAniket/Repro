[project]
name = "repro-engine"
version = "0.1.0.dev0"
description = "Repro engine: reproduces agent-written code changes base-vs-head and verifies their claims against execution evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["typer>=0.27.3"]

[project.scripts]
repro = "repro.cli:app"

[build-system]
requires = ["uv_build>=0.11.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "repro"
