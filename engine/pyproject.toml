[project]
name = "repro-engine"
version = "1.2.0"
description = "Repro engine: reproduces agent-written code changes base-vs-head and verifies their claims against execution evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.167",
    "fastapi>=0.143.0",
    "griffelib>=2.3.2,<2.4",
    "grimp>=3.17,<3.18",  # the grimp worker uses its package-finder setting, not public API
    "hypothesis>=6.169.0",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0,<3",  # `repro mcp` (K03); already required by claude-agent-sdk
    "packaging>=26.3",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "repro-events",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
repro = "repro.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "repro"
