# Expected Repro outcome for the invariants-pass fixture (F02 and F03 assert the invariants).
[fixture]
name = "invariants-pass"
head = "change/tidy-best"

[expected]
status = "VERIFIED"
claims = ["Simplify best()"]
# Every invariant enabled on base; the change keeps them all. test_best_of_many_rounds is slow
# enough to time, so perf_budget has a test to judge.
evidence = [
  "perf_diff:no_change:tests/test_score.py::test_best_of_many_rounds",
  "test_outcome:P2P:tests/test_score.py::test_best",
  "test_outcome:P2P:tests/test_score.py::test_best_of_many_rounds",
  "test_outcome:P2P:tests/test_score.py::test_best_of_none",
]
# The process sandbox only detects network use: no_network's pass says so (F03).
missing = [
  "network_not_enforced:",
  "perf_not_assessable:tests/test_score.py::test_best",
  "perf_not_assessable:tests/test_score.py::test_best_of_none",
]
invariants = [
  "forbidden_paths:pass",
  "no_network:pass",
  "no_new_dependencies:pass",
  "perf_budget:pass",
  "public_api_stable:pass",
]

[selection]
uncovered = []

[selection.selected]
"tests/test_score.py::test_best" = ["blast_radius"]
