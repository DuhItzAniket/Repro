# Optional local hooks. Enable with:  uvx pre-commit install
# Every hook runs the project's own pinned tools; no third-party hook repositories are fetched.
# CI enforces the same gates (job "lint"), so the hooks only give earlier feedback.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: biome
        name: biome check
        entry: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [javascript, jsx, ts, tsx, json]
