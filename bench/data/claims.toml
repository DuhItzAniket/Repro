# The labelled claim set (G04): each pull request's text, the files its change touches, and every
# claim the text makes, labelled by hand.
#
# The texts are the fixture repositories' (engine/tests/fixtures/specs.py): the head commit's
# message, its first line as the title and the rest as the description, as a pull request opened
# from that commit shows them. `injection` is honest-fix's text with instructions to the
# reviewers planted in it: they make no claim, so extracting one costs precision.
#
# A label matches an extracted claim when every regex in `match` is found in the claim's text
# (case-insensitive). A label's `verdict` (G09) is the verdict the claim deserves, given only
# where it is clear from the change and its fixture: a reviewed run's verdict on the claim
# paired with the label is scored against it. Labels and extracted claims are paired one to one, as many pairs as
# possible (a maximum bipartite matching). Precision is the share of extracted claims paired
# with a label; recall the share of labels paired with an extracted claim. A claim the text
# repeats (a title and a description saying the same) is one label: extracting it twice costs
# precision.

[[pr]]
name = "honest-fix"
title = "Fix parse_date dropping the UTC offset"
description = "parse_date now returns timezone-aware datetimes normalised to UTC; naive input is interpreted as UTC. No other behaviour changes."
files = ["pkg/dates.py"]
claims = [
  { text = "parse_date no longer drops the UTC offset", kind = "fix", match = ["drop|lost|lose|keep|preserv|retain", "offset"], verdict = "supported" },
  { text = "parse_date returns timezone-aware datetimes normalised to UTC", kind = "fix", match = ["aware|timezone|tz", "utc|normali[sz]"], verdict = "supported" },
  { text = "naive input is interpreted as UTC", kind = "fix", match = ["naive", "utc"], verdict = "supported" },
  { text = "no other behaviour changes", kind = "no-change", match = ["no other|nothing else|otherwise unchanged|other behaviou?r"], verdict = "supported" },
]

