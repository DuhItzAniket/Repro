# uv workspace root. It is not a distributable package: it only ties the members together
# and holds shared dev tooling configuration.
[project]
name = "repro-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["repro-engine", "repro-bench", "repro-events"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.17.0",
  "mypy>=2.4.0",
  "types-jsonschema>=4.26.0",
  "hypothesis>=6.169.0",
  "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine", "bench", "packages/events/python"]

[tool.uv.sources]
repro-engine = { workspace = true }
repro-bench = { workspace = true }
repro-events = { workspace = true }

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["engine/tests", "packages/events/python/tests", "scripts/tests"]
pythonpath = ["scripts", "engine/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["engine/src", "engine/tests", "bench/src", "packages/events/python/src", "packages/events/python/tests", "scripts"]
# Code blocks in docs are illustrative sketches, not source; Ruff 0.17 would otherwise format them.
extend-exclude = ["docs", "packages/events/python/src/repro_events/models.py"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # import order
  "B",            # bugbear
  "UP",           # pyupgrade
  "SIM",          # simplify
  "RUF",          # ruff-specific
  "PT",           # pytest style
  "C4",           # comprehensions
  "N",            # naming
  "S",            # bandit (security)
  "PERF",         # performance anti-patterns
  "TID",          # tidy imports
  "PTH",          # use pathlib (CLAUDE.md platform rule)
  "DTZ",          # timezone-aware datetimes (event timestamps are UTC)
  "T20",          # no print
  "ARG",          # unused arguments
  "RET",          # return style
  "PLC", "PLE", "PLR", "PLW",  # pylint subsets
  "ERA",          # commented-out code
  "BLE",          # blind except
]
ignore = [
  "PLR0913",      # too many arguments: keyword-only configuration objects are clearer than forced bundling
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603", "S607", "PLR2004", "ARG"]
# Spikes are measurement scripts: they shell out to git/docker and use numeric literals freely.
"spikes/**" = ["S603", "S607", "S108", "PLR2004", "S101", "ARG001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
files = ["conftest.py", "engine/src", "engine/tests", "bench/src", "packages/events/python/src", "packages/events/python/tests", "scripts"]
mypy_path = "scripts,engine/tests"
